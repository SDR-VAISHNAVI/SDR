<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RC Car Controller</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            color: white;
            text-align: center;
            padding: 40px;
        }
        h1 {
            color: #ff3b3b;
        }
#logText {
    font-family: 'Courier New', Courier, monospace;
    font-size: 14px;
    white-space: pre-wrap;
    line-height: 1.4;
}

        .control-panel {
            display: grid;
            grid-template-areas: 
                ". forward ."
                "forward-left . forward-right"
                "backward-left . backward-right"
                ". backward .";
            grid-gap: 20px;
            justify-content: center;
            align-items: center;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 10px;
        }

        .arrow {
            font-size: 2em;
            padding: 20px;
            background: white;
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
        }

        .arrow:hover {
            background: #ff3b3b;
            color: white;
        }

        .arrow-forward { grid-area: forward; }
        .arrow-backward { grid-area: backward; }
        .arrow-forward-left { grid-area: forward-left; }
        .arrow-forward-right { grid-area: forward-right; }
        .arrow-backward-left { grid-area: backward-left; }
        .arrow-backward-right { grid-area: backward-right; }

        .white-btn {
            background-color: white;
            color: black;
            padding: 12px 20px;
            margin: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .white-btn:hover {
            background-color: #ff3b3b;
            color: white;
        }
		.direction-btn{
		background-color: white;
            color: black;
            padding: 12px 20px;
            margin: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .direction-btn:hover {
            background-color: #ffffff;
            color: black;
        }
		
        .log-section {
            display: none;
            position: relative;
            background-color: #1a1a1a;
            color: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .log-container {
            max-height: 300px;
            overflow-y: auto;
            background-color: #333;
            border-radius: 5px;
            padding: 10px;
        }

        .toggle-button {
            background-color: #e74c3c;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            color: #fff;
            position: sticky;
            top: 10px;
            z-index: 1;
        }

        ul#log-list {
            list-style-type: none;
            padding: 0;
        }

        ul#log-list li {
            background-color: #444;
            margin: 5px 0;
            padding: 8px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
        }

        ul#log-list li:hover {
            background-color: #555;
        }

        #logModal {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.7);
        }

        .modal-content {
            background-color: #111;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #ff3b3b;
            width: 80%;
            color: #fff;
            border-radius: 10px;
            max-height: 70vh;
            overflow-y: auto;
            text-align: left;
        }

        .close {
            color: #ff3b3b;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>RC Car Controller</h1>

    <div class="control-panel">
        <button class="arrow arrow-forward" onclick="send('forward')">&#8593;</button>
        <button class="arrow arrow-forward-left" onclick="send('forward_left')">&#8598;</button>
        <button class="arrow arrow-forward-right" onclick="send('forward_right')">&#8599;</button>
        <button class="arrow arrow-backward-left" onclick="send('backward_left')">&#8601;</button>
        <button class="arrow arrow-backward-right" onclick="send('backward_right')">&#8600;</button>
        <button class="arrow arrow-backward" onclick="send('backward')">&#8595;</button>
    </div>

    <br>

    <div class="log-buttons">
        <button onclick="goHome()" class="white-btn">Back to Home</button>
        <button onclick="goToCustom()" class="white-btn">Create Own Pattern</button>
        <button onclick="fetchLog()" class="white-btn">Display Log</button>
        <button onclick="toggleLog()" class="white-btn">Toggle Log</button>
        <button onclick="clearLog()" class="white-btn">Clear Log</button>
        <button onclick="pauseLog()" class="white-btn">Pause Logging</button>
    </div>

    <div style="margin-top: 15px;">
        <select id="directionSelect" class="direction-btn">
            <option value="forward">Forward</option>
            <option value="backward">Backward</option>
            <option value="forward_left">Forward Left</option>
            <option value="forward_right">Forward Right</option>
            <option value="backward_left">Backward Left</option>
            <option value="backward_right">Backward Right</option>
        </select>
        <input type="number" id="delayInput" class="white-btn" placeholder="Delay (s)" style="width:150px;">
        <button onclick="scheduleTransmission()" class="white-btn">Schedule</button>
    </div>

    <div class="log-section" id="log-container">
        <div class="log-container" id="log-list-container">
            <ul id="log-list"></ul>
        </div>
    </div>

    <!-- Modal for fetched logs -->
    <div id="logModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <pre id="logText"></pre>
        </div>
    </div>

    <script>
        function send(dir) {
            fetch("/control", {
                method: "POST",
                headers: {"Content-Type": "application/x-www-form-urlencoded"},
                body: "direction=" + dir
            }).then(() => speak("Moved " + dir.replace("_", " ")));
        }

        function fetchLog() {
            fetch('/get')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('logText').innerText = data.entries.join('');
                    document.getElementById('logModal').style.display = 'block';
                    speak("Log displayed");
                })
                .catch(err => alert("Failed to fetch logs: " + err));
        }

        function toggleLog() {
            fetch('/toggle', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    const msg = data.log_active ? "Log started" : "Log stopped";
                    alert(msg);
                    speak(msg);
                });
        }

        function clearLog() {
            fetch('/clearcar', { method: 'POST' })
                .then(() => {
                    alert("Log cleared.");
                    speak("Log cleared");
                });
        }

        function pauseLog() {
            const minutes = prompt("Enter minutes to pause logging:");
            if (!minutes) return;
            fetch("/pause-log", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: `minutes=${minutes}`
            }).then(res => res.json())
              .then(data => {
                  alert(data.message);
                  speak(data.message);
              });
        }

        function scheduleTransmission() {
            const delay = document.getElementById("delayInput").value;
            const direction = document.getElementById("directionSelect").value;
            fetch("/schedule", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: `delay=${delay}&direction=${direction}`
            }).then(() => {
                const msg = `Scheduled ${direction.replace("_", " ")} in ${delay} seconds`;
                speak(msg);
                alert(msg);
            });
        }

        function goHome() {
            window.location.href = "/";
        }

        function goToCustom() {
            window.location.href = "/create-own-design";
        }

        function closeModal() {
            document.getElementById('logModal').style.display = 'none';
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
