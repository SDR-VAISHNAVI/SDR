<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: 'Lato', sans-serif;
            background-color: #121212; /* Dark background */
            margin: 0;
            padding: 0;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            height: auto;
            padding: 30px;
            background-color: #1e1e1e; /* Darker box */
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
        }

        h2 {
            margin-bottom: 20px;
            color: #ff3b3b; /* Darker matte red text */
            font-size: 24px;
        }

        input[type="text"], input[type="password"] {
            width: 90%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #282828; /* Dark input box */
            color: white;
            font-size: 16px;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #ff3b3b; /* Darker red focus border */
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #ff3b3b; /* Darker matte red button */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #7f1414; /* Even darker matte red button on hover */
        }

        .alert {
            color: #9c1c1c;
            background-color: #f8d7da;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        .footer {
            margin-top: 20px;
            color: #ff3b3b; /* Darker matte red footer text */
        }

        .footer a {
            text-decoration: none;
            color: #ff3b3b; /* Darker matte red footer link */
            font-size: 14px;
            transition: color 0.3s;
        }

        .footer a:hover {
            color: #7f1414; /* Darker red hover link */
        }

        .divider {
            margin-top: 20px;
            border-top: 1px solid #333;
            padding: 10px 0;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert">
                    {% for message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('home') }}">
            <input type="text" name="username" placeholder="Enter Username" required>
            <input type="password" name="password" placeholder="Enter Password" required>
            <button type="submit">Login</button>
        </form>

        <div class="divider">
            <p>or</p>
        </div>

        <div class="footer">
            <a href="/register">Don't have an account? Register</a>
        </div>
    </div>
</body>
</html>
