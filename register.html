<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Lato', sans-serif;
            background-color: #121212; /* Dark background */
            margin: 0;
            padding: 0;
            color: white;
        }
        .container {
            width: 100%;
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background-color: #1e1e1e; /* Darker container */
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            text-align: center;
        }
        h2 {
            color: #ff3b3b; /* Darker matte red for the heading */
            margin-bottom: 20px;
            font-size: 26px;
        }
        input[type="text"], input[type="password"] {
            width: 90%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #282828; /* Dark input box */
            color: white;
            font-size: 16px;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #ff3b3b; /* Darker red border on focus */
            outline: none;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #ff3b3b; /* Darker matte red */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #7f1414; /* Darker red on hover */
        }
        .message {
            text-align: center;
            font-size: 18px;
            color: #f44336;
        }
        .success {
            color: #4CAF50;
        }
        .info {
            color: #2196F3;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .footer {
            margin-top: 20px;
            color: #ff3b3b; /* Darker matte red footer text */
        }
        .footer a {
            text-decoration: none;
            color: #9c1c1c; /* Darker red footer link */
            font-size: 14px;
            transition: color 0.3s;
        }
        .footer a:hover {
            color: #7f1414; /* Darker red on hover */
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Register</h2>

    <!-- Display flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul class="message">
                {% for category, message in messages %}
                    <li class="{{ category }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <form method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
        </div>
        <button type="submit">Register</button>
    </form>

    <div class="footer">
        <a href="/">Already have an account? Login</a>
    </div>
</div>

</body>
</html>
